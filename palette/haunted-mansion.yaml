# The Haunted Mansion palette — the single source of truth.
#
# Every emulator config in dist/, every color in the zsh prompt, and every style in
# the ride is generated from this file. Never hardcode a hex value anywhere else.
#
# The governing rule: semantics beat theme. ANSI red must read as *error* and green
# as *success* to someone who has never heard of this repo. Theme the hue within the
# slot; never reassign the slot. `make test` enforces contrast, separation and
# colorblind-distinguishability — a change that violates those fails the build.

name: Haunted Mansion
slug: haunted-mansion
author: Leota
description: >-
  999 happy haunts, rendered in bone and ectoplasm. A cold blue-violet crypt dark
  lit by Pepper's ghost, with candle brass and oxblood velvet held back for warnings.

ui:
  background:          "#111319"  # crypt dark, blue-violet rather than neutral black
  foreground:          "#C7D0DD"  # parchment / bone
  cursor:              "#8FE3C4"  # ectoplasm
  cursor_text:         "#111319"
  selection_background: "#2B3242"  # doom buggy upholstery
  selection_foreground: "#E6ECF5"

# The sixteen ANSI slots. `name` is the lore; the slot is the contract.
ansi:
  - slot: 0
    key: black
    name: doom buggy
    normal: "#1F2431"
    bright: "#363D4C"
  - slot: 1
    key: red
    name: oxblood velvet
    normal: "#C1484F"
    bright: "#E86F76"
  - slot: 2
    key: green
    name: ectoplasm
    normal: "#5FBE8C"
    bright: "#93F2A0"
  - slot: 3
    key: yellow
    name: candle brass
    normal: "#C2A24C"
    bright: "#EBC66A"
  - slot: 4
    key: blue
    name: moonlight
    normal: "#4F7CB8"
    bright: "#7BA3D8"
  - slot: 5
    key: magenta
    name: hatbox ghost
    normal: "#8663B4"
    bright: "#AF8BDE"
  - slot: 6
    key: cyan
    name: pepper's ghost
    normal: "#5FA9BE"
    bright: "#96D6EA"
  - slot: 7
    key: white
    name: bone
    normal: "#C7D0DD"
    bright: "#E6ECF5"

# Named roles for the prompt and the ride. Each MUST resolve to an ansi key or a ui
# key above — these are aliases, not new colors, so a palette change propagates and
# the contrast tests cover them for free.
roles:
  prompt_path:      cyan
  prompt_git_clean: green
  prompt_git_dirty: yellow
  prompt_git_ahead: magenta
  prompt_error:     red
  prompt_symbol:    magenta
  greeting_ghost:   bright_cyan
  greeting_quote:   bright_magenta
  ride_candle:      bright_yellow
  ride_spectre:     bright_cyan
  ride_ectoplasm:   bright_green
  ride_velvet:      red

  # Portrait regions. The renderer tags every pixel with a region and the art
  # stores those tags, so a palette change recolours the portraits with no
  # redraw. Keep these pointing at slots, not at ui colours: the art is emitted
  # as ANSI slot numbers so it inherits whatever the terminal's theme defines.
  art_ground:       black
  art_frame:        yellow
  art_cloth:        blue
  art_hair:         magenta
  art_skin:         bright_cyan
  art_glow:         bright_green
  art_accent:       bright_white
