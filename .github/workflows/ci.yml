name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # `make check` builds, tests, and verifies dist/ matches the palette.
      # A PR that edits palette/haunted-mansion.yaml without running
      # `make generate` fails here.
      - run: make check

      - name: dist/ is committed and must match the palette
        run: git diff --exit-code dist/

      - name: greeting must stay under its latency budget
        run: |
          sudo apt-get update -qq && sudo apt-get install -y zsh hyperfine
          hyperfine --warmup 3 --runs 30 \
            --command-name 'bare zsh'  'zsh -c true' \
            --command-name 'greeting'  'HM_ROOT=$PWD zsh -c "source shell/greeting.sh"' \
            --export-json /tmp/bench.json
          python3 - <<'PY'
          import json
          r = {x["command"]: x["median"]*1000 for x in json.load(open("/tmp/bench.json"))["results"]}
          cost = r["greeting"] - r["bare zsh"]
          print(f"greeting costs {cost:.2f} ms (budget 30 ms)")
          raise SystemExit(0 if cost < 30 else 1)
          PY
