# Haunted Mansion — generated by conjure. Do not edit; edit palette/haunted-mansion.yaml.
#
# Needs a Nerd Font for the separators and glyphs, which iTerm2 and most
# terminals can be pointed at. Enable with:
#
#   brew install starship
#   # in ~/.zshrc, AFTER oh-my-zsh:
#   export STARSHIP_CONFIG=<repo>/dist/starship/haunted-mansion.toml
#   eval "$(starship init zsh)"

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:#4F7CB8)\
$os\
$username\
$hostname\
[](fg:#4F7CB8 bg:#7BA3D8)\
$directory\
[](fg:#7BA3D8 bg:#8663B4)\
$git_branch\
$git_status\
$git_state\
[](fg:#8663B4 bg:#1F2431)\
$golang$nodejs$python$rust$java$dotnet$ruby$php\
$docker_context$kubernetes$aws$azure\
[](fg:#1F2431)\
$fill\
$cmd_duration$jobs$time\
$line_break\
$character"""

right_format = ""
add_newline = true
continuation_prompt = "[  ](fg:#363D4C)"

[fill]
symbol = " "

# ─── who and where ────────────────────────────────────────────────────────────

[os]
disabled = false
style = "fg:#111319 bg:#4F7CB8"
format = '[ $symbol ]($style)'

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Windows = "󰍲"

[username]
show_always = false          # only when it is not you: root, or over ssh
style_user = "fg:#111319 bg:#4F7CB8"
style_root = "fg:#E86F76 bg:#4F7CB8 bold"
format = '[ $user ]($style)'

[hostname]
ssh_only = true              # a local box does not need to tell you its name
style = "fg:#111319 bg:#4F7CB8"
format = '[ $ssh_symbol$hostname ]($style)'
ssh_symbol = "󰢹 "

[directory]
style = "fg:#111319 bg:#7BA3D8 bold"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 4
truncate_to_repo = true      # inside a repo, show the path from its root
read_only = " 󰌾"
read_only_style = "fg:#E86F76 bg:#7BA3D8"
home_symbol = "󰋜"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = "󰇚"
"Music" = "󰝚"
"Pictures" = "󰋩"
"Source" = "󰲋"
"Developer" = "󰲋"

# ─── the crypt: git ───────────────────────────────────────────────────────────

[git_branch]
symbol = ""
style = "fg:#111319 bg:#8663B4 bold"
format = '[ $symbol $branch ]($style)'
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "fg:#111319 bg:#8663B4"
format = '([$all_status$ahead_behind]($style))'
# Every counter is spelled out: a prompt that hides how much is uncommitted is
# the reason people force-push.
conflicted = "[ ${count}](fg:#E86F76 bg:#8663B4 bold)"
ahead      = "[ ⇡${count}](fg:#111319 bg:#8663B4)"
behind     = "[ ⇣${count}](fg:#111319 bg:#8663B4)"
diverged   = "[ ⇕⇡${ahead_count}⇣${behind_count}](fg:#EBC66A bg:#8663B4 bold)"
up_to_date = ""
untracked  = "[ ?${count}](fg:#111319 bg:#8663B4)"
stashed    = "[ ${count}](fg:#111319 bg:#8663B4)"
modified   = "[ ${count}](fg:#EBC66A bg:#8663B4 bold)"
staged     = "[ ${count}](fg:#93F2A0 bg:#8663B4 bold)"
renamed    = "[ »${count}](fg:#111319 bg:#8663B4)"
deleted    = "[ ✘${count}](fg:#E86F76 bg:#8663B4 bold)"

[git_state]
style = "fg:#EBC66A bg:#8663B4 bold"
format = '[ $state ($progress_current/$progress_total) ]($style)'
rebase = "󰕍 REBASING"
merge = "󰽜 MERGING"
revert = "󰕌 REVERTING"
cherry_pick = " PICKING"
bisect = " BISECTING"

# ─── what this project is made of ─────────────────────────────────────────────

[golang]
symbol = "󰟓"
style = "fg:#96D6EA bg:#1F2431"
format = '[ $symbol $version ]($style)'

[nodejs]
symbol = "󰎙"
style = "fg:#93F2A0 bg:#1F2431"
format = '[ $symbol $version ]($style)'

[python]
symbol = "󰌠"
style = "fg:#EBC66A bg:#1F2431"
format = '[ $symbol $version( $virtualenv) ]($style)'

[rust]
symbol = "󱘗"
style = "fg:#E86F76 bg:#1F2431"
format = '[ $symbol $version ]($style)'

[java]
symbol = "󰬷"
style = "fg:#E86F76 bg:#1F2431"
format = '[ $symbol $version ]($style)'

[dotnet]
symbol = "󰪮"
style = "fg:#AF8BDE bg:#1F2431"
format = '[ $symbol $tfm ]($style)'

[ruby]
symbol = "󰴭"
style = "fg:#E86F76 bg:#1F2431"
format = '[ $symbol $version ]($style)'

[php]
symbol = "󰌟"
style = "fg:#AF8BDE bg:#1F2431"
format = '[ $symbol $version ]($style)'

# ─── where you are pointed ────────────────────────────────────────────────────

[docker_context]
symbol = "󰡨"
style = "fg:#7BA3D8 bg:#1F2431"
format = '[ $symbol $context ]($style)'
only_with_files = true

[kubernetes]
disabled = false
symbol = "󱃾"
style = "fg:#7BA3D8 bg:#1F2431"
format = '[ $symbol $context( ($namespace)) ]($style)'

[aws]
symbol = "󰸏"
style = "fg:#EBC66A bg:#1F2431"
format = '[ $symbol $profile( ($region)) ]($style)'

[azure]
disabled = false
symbol = "󰠅"
style = "fg:#7BA3D8 bg:#1F2431"
format = '[ $symbol $subscription ]($style)'

# ─── the right-hand chill ─────────────────────────────────────────────────────

[cmd_duration]
min_time = 2000              # anything under two seconds is not worth reporting
style = "fg:#EBC66A"
format = '[ 󰔟 $duration ]($style)'
show_milliseconds = false

[jobs]
symbol = "󰑮"
style = "fg:#AF8BDE"
format = '[ $symbol $number ]($style)'
number_threshold = 1

[time]
disabled = false
time_format = "%H:%M"
style = "fg:#363D4C"
format = '[ 󰥔 $time ]($style)'

# ─── the tombstone you type after ─────────────────────────────────────────────

[character]
success_symbol = "[†](bold fg:#AF8BDE)"
error_symbol = "[†](bold fg:#E86F76)"
vimcmd_symbol = "[⚰](bold fg:#93F2A0)"

[line_break]
disabled = false
